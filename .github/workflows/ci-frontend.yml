name: CI Frontend

on:
  push:
    branches: [ "main" ]
    paths:
      - '03_SourceCode/frontend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '03_SourceCode/frontend/**'

defaults:
  run:
    working-directory: ./03_SourceCode/frontend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # Tạm thời tắt cache vì chưa có package-lock.json
        # cache: 'npm'
        # cache-dependency-path: './03_SourceCode/frontend/package-lock.json'

    - name: Kiểm tra CI
      run: echo "Cấu hình CI Frontend đã sẵn sàng! Chờ team code."

    # --- KHI NÀO TEAM BẮT ĐẦU CODE THÌ BỎ COMMENT (#) CÁC DÒNG DƯỚI ĐÂY ---

    - name: Cài đặt thư viện
      run: npm install

    - name: Chạy Lint (nếu có)
      run: npm run lint
      continue-on-error: true

    - name: Build ứng dụng Frontend
      run: npm run build
