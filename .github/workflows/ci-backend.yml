name: CI Backend (NestJS)

on:
  push:
    branches: [ "main" ]
    paths:
      - '03_SourceCode/backend/**'
  pull_request:
    branches: [ "main" ]
    paths:
      - '03_SourceCode/backend/**'

defaults:
  run:
    working-directory: ./03_SourceCode/backend

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout mã nguồn
      uses: actions/checkout@v4

    - name: Cài đặt Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        # Tạm thời tắt cache vì dự án chưa có file package-lock.json
        # cache: 'npm'
        # cache-dependency-path: './03_SourceCode/backend/package-lock.json'

    - name: Kiểm tra CI
      run: echo "Cấu hình CI Backend đã sẵn sàng! Chờ team code."

    # --- KHI NÀO TEAM BẮT ĐẦU CODE THÌ BỎ COMMENT (#) CÁC DÒNG DƯỚI ĐÂY ---

    - name: Cài đặt các thư viện
      run: npm install

    - name: Kiểm tra lỗi cú pháp (Lint)
      run: npm run lint
      continue-on-error: true

    - name: Chạy Unit Test
      run: npm run test
      continue-on-error: true

    - name: Build ứng dụng
      run: npm run build
