name: ctdt-prod
services:
  db:
    image: mariadb:11.8
    environment:
      MARIADB_DATABASE: ctdt_management
      MARIADB_USER: ctdt_app
      MARIADB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?Set DB_ROOT_PASSWORD in .env}
    volumes:
      - database:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30
  init:
    build:
      context: ../..
      dockerfile: 03_SourceCode/backend/Dockerfile
      target: production
    environment: &backend_env
      DB_HOST: db
      DB_PORT: 3306
      DB_USERNAME: ctdt_app
      DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
      DB_DATABASE: ctdt_management
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      FRONTEND_URL: ${APP_ORIGIN:?Set APP_ORIGIN to the public HTTPS origin}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?Set BOOTSTRAP_ADMIN_PASSWORD in .env}
    command: ["sh", "-c", "node scripts/database/bootstrap.cjs --if-empty && npm run migration:run:prod"]
    depends_on:
      db:
        condition: service_healthy
  backend:
    build:
      context: ../..
      dockerfile: 03_SourceCode/backend/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      <<: *backend_env
      BOOTSTRAP_ADMIN_PASSWORD: ""
      SMTP_HOST: ${SMTP_HOST:-smtp.gmail.com}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-}
      PORT: 3002
    volumes:
      - documents:/app/03_SourceCode/backend/storage
    depends_on:
      init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3002/api').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 30
  frontend:
    build:
      context: ../..
      dockerfile: 03_SourceCode/frontend/Dockerfile
      target: production
    restart: unless-stopped
    environment:
      DATABASE_URL: mysql://ctdt_app:${DB_PASSWORD_URLENCODED:?Set DB_PASSWORD_URLENCODED in .env}@db:3306/ctdt_management
      BACKEND_API_URL: http://backend:3002
      APP_ORIGIN: ${APP_ORIGIN:?Set APP_ORIGIN to the public HTTPS origin}
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      backend:
        condition: service_healthy
volumes:
  database:
  documents:
